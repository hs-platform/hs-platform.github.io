<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Article - HS Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1><a href="index.html">HS Platform</a></h1>

  <div class="section-title">Add New Draft</div>

  <form action="index.html">
    <label for="article-title">Title Of Article</label>
    <input type="text" id="article-title" required>

    <label>Topics</label>
    <div class="plus-action">+ &nbsp;&nbsp; Add Tag</div>

    <label for="bio">Bio</label>
    <div class="editor-toolbar">
      <strong>B</strong> <em>I</em> <u>U</u> &ldquo; &#128279; &equiv;
    </div>
    <textarea id="bio"></textarea>

    <div>
      <span class="warning-banner">Review Can be take a 72 hours please be careful.</span>
    </div>

    <button type="submit" class="btn-green">ADD ARTICLE</button>
  </form>

  <footer>
    &copy; 2020 Hacking Studio Platform
  </footer>
</body>
</html>
